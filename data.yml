project: commnotes-analysis

notes:
  - Raw data files are not included in this repository.
  - The analyses use the same public Community Notes data, but different pipelines create different intermediate files and outputs.

raw_data_snapshot:
  source: "X Community Notes public data"
  source_url: "https://communitynotes.x.com/guide/en/under-the-hood/download-data"
  expected_location: "Place these files in the working directory expected by each pipeline."
  required_files:
    - "notes-00000.tsv"
    - "noteStatusHistory-00000.tsv"
    - "userEnrollment-00000.tsv"
    - "ratings/*.tsv"
    - "ratings2023/*.tsv"

pipelines:
  communitynotes_2022:
    description: "2022 Community Notes scoring code used to generate weekly outputs."
    code_dir: "data_generation/communitynotes_2022"
    expected_working_directory: "data_generation/communitynotes_2022"
    raw_inputs:
      - "notes-00000.tsv"
      - "noteStatusHistory-00000.tsv"
      - "userEnrollment-00000.tsv"
      - "ratings2023/*.tsv"
    generated_intermediate_files:
      - path: "merged_ratings2023.tsv"
        generated_by: "data_generation/communitynotes_2022/merge_ratings.py"
        description: "Concatenates all TSV files in ratings2023/."
      - path: "ratings_filtered.tsv"
        generated_by: "data_generation/communitynotes_2022/weekly2022.py"
        description: "Weekly cutoff-filtered ratings file, overwritten during each weekly run."
    generated_outputs:
      - path: "weekly_outputs/"
        generated_by: "data_generation/communitynotes_2022/weekly2022.py"

  communitynotes_2025:
    description: "Later Community Notes scoring code used for timestamped analyses."
    code_dir: "data_generation/communitynotes_2025"
    expected_working_directory: "data_generation/communitynotes_2025"
    raw_inputs:
      - "notes-00000.tsv"
      - "noteStatusHistory-00000.tsv"
      - "userEnrollment-00000.tsv"
      - "ratings/*.tsv"
    generated_outputs:
      - path: "output_YYYY_MM_DD/"
        generated_by: "data_generation/communitynotes_2025/timestamp.py"
        description: "Weekly note and rater parameter outputs."

  communitynotes_twostage:
    description: "Two-stage matrix factorization pipeline."
    code_dir: "data_generation/communitynotes_twostage"
    expected_working_directory: "data_generation/communitynotes_twostage"
    raw_inputs:
      - "ratings/clean-ratings-*"
    input_filters:
      - "clean-ratings-* are derived from ratings-*.tsv with rows missing helpfulnessLevel removed."
      - "run_mf.py reads ratings from 2023-01-01 through 2024-06-01, then trains weekly updates after 2023-06-01."
    generated_outputs:
      - path: "output_final/"
        generated_by: "data_generation/communitynotes_twostage/run_mf.py"

topic_modeling:
  - path: "notes_llm_topic.csv"
    source: ""
    used_by:
      - "analysis notebooks"
  - path: "df_notes_with_topics.csv"
    source: "Generated by analysis/src/data_loader.py using data_generation/communitynotes_2025/scoring/topic_model.py."
    used_by:
      - "analysis notebooks"
